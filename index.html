<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>問問題</title>
<style>
  :root{
    --ink:#16302B;
    --paper:#FBF3E7;
    --coral:#E85D75;
    --mustard:#E7B84E;
    --line: rgba(251,243,231,0.16);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--ink);
    color:var(--paper);
    font-family:-apple-system, BlinkMacSystemFont, "PingFang TC", "Helvetica Neue", sans-serif;
    display:flex;
    flex-direction:column;
    min-height:100vh;
    min-height:100dvh;
    overflow:hidden;
  }

  /* top bar */
  .topbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding: max(18px, env(safe-area-inset-top)) 20px 10px;
  }
  .brand{
    font-size:13px;
    letter-spacing:0.04em;
    color: rgba(251,243,231,0.55);
  }
  .icon-btn{
    width:38px;height:38px;
    border-radius:50%;
    border:1px solid var(--line);
    background:transparent;
    color:var(--paper);
    display:flex;align-items:center;justify-content:center;
    font-size:18px;
    cursor:pointer;
  }
  .icon-btn:active{ background: rgba(251,243,231,0.08); }

  /* card stage */
  .stage{
    flex:1;
    display:flex;
    align-items:center;
    justify-content:center;
    padding: 10px 28px;
    position:relative;
  }
  .card{
    width:100%;
    max-width:520px;
    background:var(--paper);
    color:var(--ink);
    border-radius:22px;
    padding: 52px 34px;
    min-height: 260px;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    box-shadow: 0 30px 60px rgba(0,0,0,0.35);
    position:relative;
    transform: translateY(0);
    transition: transform 0.28s cubic-bezier(.2,.8,.2,1), opacity 0.28s;
  }
  .card.out{ transform: translateY(-14px); opacity:0; }
  .card.in{ transform: translateY(14px); opacity:0; }
  .qmark{
    position:absolute;
    top:16px; left:22px;
    font-family: Georgia, "Times New Roman", serif;
    font-size:34px;
    color: var(--coral);
    opacity:0.55;
  }
  .question{
    font-family: Georgia, "Times New Roman", serif;
    font-size: clamp(22px, 6vw, 30px);
    line-height:1.45;
    font-weight:400;
  }
  .counter{
    position:absolute;
    bottom:16px; right:20px;
    font-size:12px;
    color: rgba(22,48,43,0.4);
    font-family: -apple-system, sans-serif;
  }

  /* bottom controls */
  .controls{
    padding: 14px 28px max(24px, env(safe-area-inset-bottom));
    display:flex;
    justify-content:center;
  }
  .next-btn{
    width:100%;
    max-width:520px;
    background:var(--coral);
    color:var(--paper);
    border:none;
    border-radius:16px;
    padding:18px 0;
    font-size:17px;
    font-weight:600;
    letter-spacing:0.01em;
    cursor:pointer;
  }
  .next-btn:active{ background:#d54f66; }

  /* settings panel */
  .panel{
    position:fixed;
    inset:0;
    background: rgba(22,48,43,0.6);
    backdrop-filter: blur(2px);
    display:flex;
    align-items:flex-end;
    opacity:0;
    pointer-events:none;
    transition: opacity 0.22s;
    z-index:10;
  }
  .panel.show{ opacity:1; pointer-events:auto; }
  .sheet{
    background:var(--paper);
    color:var(--ink);
    width:100%;
    max-height:82vh;
    border-radius: 24px 24px 0 0;
    padding: 18px 22px max(22px, env(safe-area-inset-bottom));
    transform: translateY(100%);
    transition: transform 0.28s cubic-bezier(.2,.8,.2,1);
    display:flex;
    flex-direction:column;
  }
  .panel.show .sheet{ transform: translateY(0); }
  .sheet-handle{
    width:36px;height:4px;background:rgba(22,48,43,0.2);
    border-radius:2px; margin:0 auto 14px;
  }
  .sheet-head{
    display:flex;justify-content:space-between;align-items:center;
    margin-bottom:14px;
  }
  .sheet-head h2{ font-size:18px; margin:0; font-weight:600; }
  .close-btn{
    background:none;border:none;font-size:15px;color:var(--coral);
    font-weight:600; cursor:pointer; padding:4px;
  }
  .add-row{
    display:flex; gap:8px; margin-bottom:16px;
  }
  .add-row input{
    flex:1;
    border:1px solid rgba(22,48,43,0.18);
    border-radius:12px;
    padding:12px 14px;
    font-size:15px;
    background:#fff;
    color:var(--ink);
  }
  .add-row input:focus{ outline:2px solid var(--coral); }
  .add-btn{
    background:var(--ink); color:var(--paper);
    border:none;border-radius:12px;
    padding:0 18px; font-size:15px; font-weight:600;
    cursor:pointer;
  }
  .list{
    overflow-y:auto;
    display:flex; flex-direction:column; gap:8px;
  }
  .list-item{
    display:flex; justify-content:space-between; align-items:center;
    gap:10px;
    padding:12px 14px;
    background:#fff;
    border-radius:12px;
    font-size:14px;
    border:1px solid rgba(22,48,43,0.08);
  }
  .list-item span{ line-height:1.4; }
  .del-btn{
    background:none; border:none; color:rgba(22,48,43,0.35);
    font-size:18px; line-height:1; cursor:pointer; padding:2px 4px;
    flex-shrink:0;
  }
  .empty-hint{
    font-size:13px; color:rgba(22,48,43,0.45); text-align:center; padding:18px 0;
  }
  .section-label{
    font-size:12px; color:rgba(22,48,43,0.4); margin:6px 0 8px;
  }
</style>
</head>
<body>

  <div class="topbar">
    <div class="brand">問問題</div>
    <button class="icon-btn" id="settingsBtn" aria-label="設定">⚙</button>
  </div>

  <div class="stage">
    <div class="card" id="card">
      <div class="qmark">?</div>
      <div class="question" id="question">載入中…</div>
      <div class="counter" id="counter"></div>
    </div>
  </div>

  <div class="controls">
    <button class="next-btn" id="nextBtn">Next</button>
  </div>

  <div class="panel" id="panel">
    <div class="sheet">
      <div class="sheet-handle"></div>
      <div class="sheet-head">
        <h2>新增題目</h2>
        <button class="close-btn" id="closeBtn">完成</button>
      </div>
      <div class="add-row">
        <input id="newQInput" type="text" placeholder="輸入新問題，按 + 新增" maxlength="120">
        <button class="add-btn" id="addBtn">＋</button>
      </div>
      <div class="section-label">你新增的題目</div>
      <div class="list" id="customList"></div>
    </div>
  </div>

<script>
  const DEFAULT_QUESTIONS = [
    "你這輩子做過最勇敢的一件事是什麼？",
    "如果可以立刻精通一項技能，你會選什麼？",
    "有什麼事是你以前害怕、現在覺得還好的？",
    "你最近一次哭是因為什麼？",
    "小時候的你，會對現在的你說什麼？",
    "你覺得自己被誤解最多的一點是什麼？",
    "有沒有一個決定，你到現在還會想「如果當初…」？",
    "什麼事情會讓你瞬間充滿能量？",
    "你心目中「成功」的定義是什麼？",
    "最近讓你笑到不行的一件事是什麼？",
    "如果明天可以重來一天，你會怎麼過？",
    "你最珍惜的一段友情是怎麼開始的？",
    "有什麼習慣是你一直想改掉卻改不了的？",
    "你人生中影響你最深的一句話是什麼？",
    "如果可以跟十年後的自己說一句話，你會說什麼？",
    "你最近在為什麼事情感到焦慮？",
    "有什麼興趣是你一直想嘗試卻還沒開始的？",
    "你覺得自己跟家人最像的地方是什麼？",
    "什麼樣的陪伴對你來說最有安全感？",
    "有沒有一首歌，一聽就會想起某個人或某段時光？",
    "你最近做過最讓自己驕傲的小事是什麼？",
    "如果只能留一樣物品，你會留下什麼？為什麼？",
    "你覺得自己現在最需要的是什麼？",
    "有什麼話你一直想對某個人說，但還沒說出口？",
    "你最喜歡自己身上的哪個特質？",
    "有什麼事讓你對這個世界重新有了信心？",
    "你會怎麼形容現在的自己，用三個詞？",
    "你最想去卻還沒去過的地方是哪裡？",
    "如果今天是你人生最後一天，你會做什麼？",
    "有什麼是你長大後才懂的道理？",
    "你覺得朋友之間最重要的是什麼？",
    "最近有什麼事情讓你重新思考自己的方向？",
    "你曾經放棄過什麼，現在回想覺得可惜嗎？",
    "什麼樣的瞬間會讓你覺得「活著真好」？",
    "如果可以問我一個問題，你會問什麼？"
  ];

  const STORAGE_KEY = "qapp_custom_questions_v1";
  const HISTORY_KEY = "qapp_history_v1";

  function loadCustom(){
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : [];
    }catch(e){ return []; }
  }
  function saveCustom(list){
    localStorage.setItem(STORAGE_KEY, JSON.stringify(list));
  }

  let customQuestions = loadCustom();
  let pool = []; // shuffled indices not yet shown this round
  let allQuestions = [];
  let currentIndex = -1;

  function buildAllQuestions(){
    allQuestions = DEFAULT_QUESTIONS.concat(customQuestions);
  }

  function refillPool(){
    pool = allQuestions.map((_, i) => i);
    // simple shuffle
    for(let i = pool.length - 1; i > 0; i--){
      const j = Math.floor(Math.random() * (i + 1));
      [pool[i], pool[j]] = [pool[j], pool[i]];
    }
  }

  function showQuestion(animateDir){
    const card = document.getElementById("card");
    const qEl = document.getElementById("question");
    const counterEl = document.getElementById("counter");

    const render = () => {
      if(pool.length === 0) refillPool();
      currentIndex = pool.pop();
      qEl.textContent = allQuestions[currentIndex];
      counterEl.textContent = allQuestions.length + " 題中";
      card.classList.remove("out","in");
      void card.offsetWidth;
      card.classList.add("in");
      requestAnimationFrame(()=> card.classList.remove("in"));
    };

    if(animateDir){
      card.classList.add("out");
      setTimeout(render, 180);
    } else {
      render();
    }
  }

  function renderCustomList(){
    const listEl = document.getElementById("customList");
    listEl.innerHTML = "";
    if(customQuestions.length === 0){
      listEl.innerHTML = '<div class="empty-hint">還沒有新增任何題目</div>';
      return;
    }
    customQuestions.forEach((q, idx) => {
      const row = document.createElement("div");
      row.className = "list-item";
      const span = document.createElement("span");
      span.textContent = q;
      const btn = document.createElement("button");
      btn.className = "del-btn";
      btn.textContent = "✕";
      btn.onclick = () => {
        customQuestions.splice(idx, 1);
        saveCustom(customQuestions);
        buildAllQuestions();
        refillPool();
        renderCustomList();
      };
      row.appendChild(span);
      row.appendChild(btn);
      listEl.appendChild(row);
    });
  }

  document.getElementById("nextBtn").addEventListener("click", () => showQuestion(true));

  document.getElementById("settingsBtn").addEventListener("click", () => {
    renderCustomList();
    document.getElementById("panel").classList.add("show");
  });
  document.getElementById("closeBtn").addEventListener("click", () => {
    document.getElementById("panel").classList.remove("show");
  });
  document.getElementById("panel").addEventListener("click", (e) => {
    if(e.target.id === "panel") document.getElementById("panel").classList.remove("show");
  });

  function addQuestion(){
    const input = document.getElementById("newQInput");
    const val = input.value.trim();
    if(!val) return;
    customQuestions.push(val);
    saveCustom(customQuestions);
    buildAllQuestions();
    refillPool();
    renderCustomList();
    input.value = "";
    input.focus();
  }
  document.getElementById("addBtn").addEventListener("click", addQuestion);
  document.getElementById("newQInput").addEventListener("keydown", (e) => {
    if(e.key === "Enter") addQuestion();
  });

  buildAllQuestions();
  refillPool();
  showQuestion(false);
</script>
</body>
</html>
